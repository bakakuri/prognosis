<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050508" />
  <meta name="description" content="PredictX — Free football prediction and analytics platform. Elo, Poisson, Dixon-Coles models. No subscriptions." />
  <meta property="og:title" content="PredictX Football Predictions" />
  <meta property="og:description" content="Free football prediction platform — statistical models, no guarantees, no subscriptions." />
  <meta property="og:type" content="website" />
  <title>PredictX — Football Analytics</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/navigation.css" />
  <link rel="stylesheet" href="/css/cards.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
  <!-- App Shell -->
  <div id="app" class="app">

    <!-- Sidebar Navigation (desktop) -->
    <nav id="sidebar-nav" class="sidebar-nav" aria-label="Main navigation"></nav>

    <!-- Main Content Area -->
    <div class="app-body">

      <!-- Top Header -->
      <header id="app-header" class="app-header">
        <div class="header-inner">
          <button class="header-menu-btn" id="menu-toggle" aria-label="Toggle menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <a href="/" class="header-logo" data-link>
            <span class="logo-icon">⚡</span>
            <span class="logo-text">PredictX</span>
          </a>
          <div class="header-actions">
            <button class="header-search-btn" id="search-trigger" aria-label="Search">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
              </svg>
            </button>
          </div>
        </div>
        <!-- Search overlay -->
        <div class="search-overlay" id="search-overlay" hidden>
          <div class="search-inner">
            <div class="search-field">
              <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
              </svg>
              <input type="search" id="global-search" class="search-input" placeholder="Search teams, leagues, players…" autocomplete="off" />
              <button class="search-close" id="search-close" aria-label="Close search">✕</button>
            </div>
            <div id="search-results" class="search-results"></div>
          </div>
        </div>
      </header>

      <!-- Page View (router renders here) -->
      <main id="page-view" class="page-view" role="main">
        <!-- Loading state -->
        <div class="page-loader" id="page-loader">
          <div class="loader-spinner"></div>
        </div>
      </main>

    </div><!-- /.app-body -->

    <!-- Bottom Navigation (mobile) -->
    <nav id="bottom-nav" class="bottom-nav" aria-label="Bottom navigation"></nav>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- PWA Install Prompt -->
    <div id="pwa-install-banner" class="pwa-banner" hidden>
      <div class="pwa-banner-inner">
        <span class="pwa-banner-icon">⚡</span>
        <div class="pwa-banner-text">
          <strong>Install PredictX</strong>
          <span>Add to your home screen</span>
        </div>
        <div class="pwa-banner-actions">
          <button id="pwa-install-btn" class="btn btn-accent btn-sm">Install</button>
          <button id="pwa-dismiss-btn" class="btn btn-ghost btn-sm">Not now</button>
        </div>
      </div>
    </div>

 

  <!-- Scripts (ES modules) -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
